version: 2
updates:
  # The library module has no dependencies by design; only workflow actions
  # and the separate examples module are tracked.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action/init and /analyze must stay on the same release:
      # a bump of one alone fails, as #42 and #44 did.
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: gomod
    directory: /examples
    schedule:
      interval: weekly
