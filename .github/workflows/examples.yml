name: Examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  REFSET_PG_URL: postgres://refset:refset@localhost:5432/refset?sslmode=disable

# Separate from the library's CI: a broken example never blocks a library change.
jobs:
  examples:
    name: Examples (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: refset
          POSTGRES_PASSWORD: refset
          POSTGRES_DB: refset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refset"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: examples
          args: --config ../.golangci.yml
      - name: Test (pgsource conformance and integration, filesource)
        run: go test -race ./...
      - name: Run the demos
        run: |
          go run ./currencies
          go run ./plan-upgrade
          go run ./baseline-lru
          go run ./structs
          go run ./httpjson
          go run ./dbrows
