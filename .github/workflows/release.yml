# Release on a tag vX.Y.Z (steps in docs/releasing.md). The library is a Go
# module, so there are no binaries: the release checks the tag, runs the
# same suite as CI and the examples on every supported Go and Postgres
# version, publishes the CHANGELOG section as a GitHub release, and asks the
# Go module proxy to fetch the new version so pkg.go.dev lists it.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  preflight:
    name: Tag checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Tag is a release version on main
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: CHANGELOG.md has a dated section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md needs a '## [$version] - YYYY-MM-DD' section"; exit 1; }
      - name: Zero dependencies in the library module
        run: ./scripts/check-zero-deps.sh

  test:
    name: Library (Go ${{ matrix.go }})
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Tests with race detector
        run: go test -race -shuffle=on -count=1 ./...
      - name: govulncheck
        if: matrix.go == '1.27.x'
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  examples:
    name: Examples (Postgres ${{ matrix.postgres }})
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: refset
          POSTGRES_PASSWORD: refset
          POSTGRES_DB: refset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refset"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Examples tests
        working-directory: examples
        env:
          REFSET_PG_URL: postgres://refset:refset@localhost:5432/refset?sslmode=disable
        run: go test -race -count=1 ./...

  release:
    name: GitHub release
    needs: [test, examples]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086 # $prerelease is empty or one flag
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $prerelease

  proxy:
    name: Publish to the Go module proxy
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Fetch the new version through proxy.golang.org (pkg.go.dev follows)
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          module="github.com/${GITHUB_REPOSITORY}"
          for attempt in 1 2 3 4 5; do
            if go list -m "${module}@${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 15))
          done
          echo "::error::the proxy did not serve ${module}@${GITHUB_REF_NAME}"
          exit 1
