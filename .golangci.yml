version: "2"

run:
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint   # wrap and compare errors correctly (errors.Is / errors.As)
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - copyloopvar
    - nolintlint
    - gosec       # security checks on shipped code (tests and benchmark tools excluded below)
  exclusions:
    rules:
      # Tests and the benchmark tools use weak randomness, fixed paths and
      # unchecked errors on purpose; gosec reviews the code that ships.
      - path: _test\.go
        linters: [gosec]
      - path: (^|/)perfreport/
        linters: [gosec]
  settings:
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/azbyluthfan/refset
