# Postgres for the examples and their tests:
#   docker compose -f examples/docker-compose.yml up -d
#   export REFSET_PG_URL=postgres://refset:refset@localhost:55432/refset?sslmode=disable
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: refset
      POSTGRES_PASSWORD: refset
      POSTGRES_DB: refset
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refset"]
      interval: 1s
      timeout: 3s
      retries: 30
